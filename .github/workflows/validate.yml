name: Validate Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install -r requirements.txt
      - name: Run contract & receipt validator
        run: python contracts/validate_package.py
      - name: Run unittest suite
        run: python -m unittest discover -s contracts -v
